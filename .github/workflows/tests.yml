name: E2E & API tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # needed by the JUnit test-summary step

jobs:
  playwright:
    name: Playwright (API + UI)
    # Windows runner: the backend uses SQL Server LocalDB exactly as in development,
    # so no application code or connection-string changes are needed for CI.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      TEST_DB_CONNECTION: Server=(localdb)\MSSQLLocalDB;Database=PetStore_Test;TrustServerCertificate=True;Trusted_Connection=True

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (8 runtime for the API, 9 for the dotnet-ef tool)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            front_end/package-lock.json
            tests/package-lock.json

      - name: Install SQL Server LocalDB
        uses: potatoqualitee/mssqlsuite@v1.12
        with:
          install: localdb

      - name: Build backend
        run: dotnet build back_end/PetStoreAPI/PetStoreAPI/PetStoreAPI.csproj -c Debug

      - name: Install frontend dependencies
        run: npm ci
        working-directory: front_end

      - name: Lint frontend
        run: npm run lint
        working-directory: front_end

      - name: Type-check & build frontend
        run: npm run build
        working-directory: front_end
        env:
          # The production build only needs the variables to exist
          VITE_FIREBASE_API_KEY: ci
          VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci
          VITE_FIREBASE_STORAGE_BUCKET: ci.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
          VITE_FIREBASE_APP_ID: '1:0:web:0'

      - name: Install test dependencies
        run: npm ci
        working-directory: tests

      - name: Create test database (EF Core migrations)
        run: npm run db:setup
        working-directory: tests

      - name: Install Playwright browser
        run: npx playwright install chromium
        working-directory: tests

      - name: Type-check test code
        run: npm run typecheck
        working-directory: tests

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: tests

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14

      - name: Upload test results (JUnit, screenshots, traces, videos)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/test-results/
          retention-days: 14

      - name: Publish test summary
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: Playwright results
          path: tests/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false
